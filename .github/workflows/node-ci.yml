name: Reusable Node.js CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        type: string
        required: false
        default: "24"
      package-manager:
        description: Package manager used by the project
        type: string
        required: false
        default: npm
      install-command:
        description: Optional install command override (defaults to npm ci or pnpm install --frozen-lockfile)
        type: string
        required: false
        default: ""
      lint-command:
        description: Lint command; leave empty to skip
        type: string
        required: false
        default: ""
      typecheck-command:
        description: Typecheck command; leave empty to skip
        type: string
        required: false
        default: ""
      test-command:
        description: Test command; leave empty to skip
        type: string
        required: false
        default: ""
      build-command:
        description: Build command; leave empty to skip
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  validate:
    # Draft PRs should not spend CI minutes. The caller must include ready_for_review in its pull_request event types.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -n "${{ inputs.install-command }}" ]]; then
            ${{ inputs.install-command }}
          elif [[ "${{ inputs.package-manager }}" == "pnpm" ]]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Lint
        if: inputs.lint-command != ''
        run: ${{ inputs.lint-command }}

      - name: Typecheck
        if: inputs.typecheck-command != ''
        run: ${{ inputs.typecheck-command }}

      - name: Test
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}

      - name: Build
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}
